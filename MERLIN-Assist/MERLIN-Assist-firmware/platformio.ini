; PlatformIO Project Configuration File

[env:heltec_wifi_lora_32_V4]
platform = espressif32
board = heltec_wifi_lora_32_V3 ; no newer model available yet
board_build.mcu = esp32s3
framework = arduino
build_flags =
  ;-D ARDUINO_USB_MODE=1
  ;-D ARDUINO_USB_CDC_ON_BOOT=1
  -D EMERGENCY_BUTTON=1
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
  jgromes/RadioLib@^7.5.0
;  avinabmalla/ESP32_BleSerial@^3.0.0
  rweather/Crypto@^0.4.0
  https://github.com/roloran/SchnorrSig
  https://github.com/roloran/Unishox_Arduino_lib
  marcoschwartz/LiquidCrystal_I2C